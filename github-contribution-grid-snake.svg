<svg width="840" height="140" viewBox="0 0 840 140" xmlns="http://www.w3.org/2000/svg">
  <title>Pac-Man eating dots and a cherry</title>
  <defs>
    <clipPath id="pacman-body">
      <circle cx="0" cy="0" r="28"/>
    </clipPath>
  </defs>
  <rect x="1" y="1" width="838" height="138" rx="18" fill="#0d1117" stroke="#30363d"/>

  <g fill="#ffd43b">
    <circle cx="170" cy="70" r="5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.123;0.135;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="70" r="5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.231;0.243;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="70" r="5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.339;0.351;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="70" r="5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.447;0.459;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="490" cy="70" r="5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.556;0.568;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="570" cy="70" r="5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.664;0.676;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="70" r="5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.772;0.784;1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(770 70)">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.934;0.946;1" dur="4s" repeatCount="indefinite"/>
    <g shape-rendering="crispEdges">
      <g fill="#3fb950">
        <rect x="-4" y="-8" width="4" height="4"/>
        <rect x="0" y="-12" width="4" height="4"/>
        <rect x="4" y="-16" width="4" height="4"/>
        <rect x="8" y="-20" width="4" height="4"/>
        <rect x="8" y="-16" width="4" height="12"/>
        <rect x="8" y="-4" width="4" height="4"/>
        <rect x="12" y="-24" width="8" height="4"/>
        <rect x="16" y="-20" width="8" height="4"/>
      </g>
      <rect x="-8" y="-4" width="8" height="4" fill="#ff4b4b"/>
      <rect x="-12" y="0" width="16" height="8" fill="#ff4b4b"/>
      <rect x="-8" y="8" width="8" height="4" fill="#c92a2a"/>
      <rect x="8" y="0" width="8" height="4" fill="#e83232"/>
      <rect x="4" y="4" width="16" height="8" fill="#e83232"/>
      <rect x="8" y="12" width="8" height="4" fill="#b52222"/>
      <rect x="-8" y="0" width="4" height="4" fill="#ff9b9b"/>
      <rect x="8" y="4" width="4" height="4" fill="#ff8080"/>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" from="70 70" to="810 70" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.985;0.997;1" dur="4s" repeatCount="indefinite"/>
    <g clip-path="url(#pacman-body)">
      <circle cx="0" cy="0" r="28" fill="#ffd43b"/>
      <path fill="#000000" d="M 0 0 L 36 -36 L 36 36 Z">
        <animate attributeName="d" values="M 0 0 L 36 -36 L 36 36 Z;M 0 0 L 36 -0.5 L 36 0.5 Z;M 0 0 L 36 -36 L 36 36 Z" dur="0.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <circle cx="4" cy="-15" r="3.2" fill="#000000"/>
  </g>
</svg>
